<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-label="Markowitz workflow: Design, Backtest, Calibrate, Deliver">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="660" fill="#FCFCFB"/>
  <rect x="16" y="16" width="1248" height="628" rx="24" fill="none" stroke="#E4E7F5" stroke-width="1.5"/>

  <!-- 标题 -->
  <text x="640" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Markowitz — Offline Quant Strategy Development</text>
  <text x="640" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#6B7280">Deterministic strategy code, calibrated by historical backtests — never guesses, never trades</text>

  <!-- 步骤 1: Design -->
  <g>
    <rect x="16" y="140" width="250" height="330" rx="18" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="30" y="154" width="62" height="24" rx="12" fill="#EEF2FF"/>
    <text x="61" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#4F46E5">STEP 1</text>
    <text x="141" y="220" text-anchor="middle" font-size="38">🧩</text>
    <text x="141" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">Design</text>
    <text x="141" y="294" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4B5563">Pure-function strategy</text>
    <text x="141" y="316" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#374151">evaluate(bars, params)</text>
    <text x="141" y="338" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4B5563">No lookahead · quantified</text>
    <rect x="46" y="392" width="190" height="30" rx="15" fill="#EEF2FF"/>
    <text x="141" y="412" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#4F46E5">strategies/*.py</text>
  </g>

  <!-- 箭头 1→2 -->
  <g>
    <line x1="266" y1="305" x2="300" y2="305" stroke="#4F46E5" stroke-width="2.5"/>
    <polygon points="302,305 292,299 292,311" fill="#4F46E5"/>
  </g>

  <!-- 步骤 2: Backtest -->
  <g>
    <rect x="310" y="140" width="250" height="330" rx="18" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="324" y="154" width="62" height="24" rx="12" fill="#EEF2FF"/>
    <text x="355" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#4F46E5">STEP 2</text>
    <text x="435" y="220" text-anchor="middle" font-size="38">🔬</text>
    <text x="435" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">Backtest</text>
    <text x="435" y="294" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4B5563">Walk every K-line bar</text>
    <text x="435" y="316" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4B5563">Stop / take / timeout exits</text>
    <text x="435" y="338" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4B5563">t+1 open fills, net of costs</text>
    <rect x="340" y="392" width="190" height="30" rx="15" fill="#EEF2FF"/>
    <text x="435" y="412" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#4F46E5">R-series per trade</text>
  </g>

  <!-- 箭头 2→3 -->
  <g>
    <line x1="560" y1="305" x2="594" y2="305" stroke="#4F46E5" stroke-width="2.5"/>
    <polygon points="596,305 586,299 586,311" fill="#4F46E5"/>
  </g>

  <!-- 步骤 3: Calibrate -->
  <g>
    <rect x="604" y="140" width="250" height="330" rx="18" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="618" y="154" width="62" height="24" rx="12" fill="#EEF2FF"/>
    <text x="649" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#4F46E5">STEP 3</text>
    <text x="729" y="220" text-anchor="middle" font-size="38">⚖️</text>
    <text x="729" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">Calibrate</text>
    <text x="729" y="294" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4B5563">Aggregate per category</text>
    <text x="729" y="316" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4B5563">win_rate · avg_R · samples</text>
    <text x="729" y="338" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4B5563">Small samples discounted</text>
    <rect x="634" y="392" width="190" height="30" rx="15" fill="#EEF2FF"/>
    <text x="729" y="412" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#4F46E5">confidence_table.json</text>
  </g>

  <!-- 箭头 3→4 -->
  <g>
    <line x1="854" y1="305" x2="888" y2="305" stroke="#4F46E5" stroke-width="2.5"/>
    <polygon points="890,305 880,299 880,311" fill="#4F46E5"/>
  </g>

  <!-- 步骤 4: Deliver -->
  <g>
    <rect x="898" y="140" width="250" height="330" rx="18" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="912" y="154" width="62" height="24" rx="12" fill="#EEF2FF"/>
    <text x="943" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#4F46E5">STEP 4</text>
    <text x="1023" y="220" text-anchor="middle" font-size="38">📤</text>
    <text x="1023" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">Deliver</text>
    <text x="1023" y="294" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4B5563">Strategy + credibility table</text>
    <text x="1023" y="316" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4B5563">One weighted vote for Victor</text>
    <text x="1023" y="338" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4B5563">Backtest grades, never self-rating</text>
    <rect x="928" y="392" width="190" height="30" rx="15" fill="#EEF2FF"/>
    <text x="1023" y="412" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#4F46E5">→ Victor (weighted vote)</text>
  </g>

  <!-- 箭头 4 → 底部交付条 -->
  <g>
    <line x1="1023" y1="470" x2="1023" y2="494" stroke="#4F46E5" stroke-width="2.5"/>
    <polygon points="1023,496 1017,486 1029,486" fill="#4F46E5"/>
  </g>

  <!-- 底部：Victor 交付条 -->
  <g>
    <rect x="16" y="504" width="1248" height="118" rx="18" fill="url(#bar)" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="56" y="552" font-size="30">📡</text>
    <text x="112" y="545" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937">Victor — DayTradingAgent</text>
    <text x="112" y="572" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#4B5563">Live: strategy signal + category -> look up credibility in the table -> one weighted vote in Victor's final signal</text>
    <rect x="112" y="590" width="400" height="22" rx="11" fill="#FFFFFF"/>
    <text x="312" y="605" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7280">Markowitz stays offline — no account, no order, no signal of its own</text>
  </g>
</svg>
